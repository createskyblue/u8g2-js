<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u8g2-js · 中文字体家族对比</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f2f3f5; color:#222; max-width:1500px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:#666; font-size:13px; line-height:1.7; margin-bottom:12px; }
  #tabs { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .tab { border:1px solid #c5c9cf; background:#fff; color:#333; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .tab:hover { border-color:#1a73e8; }
  .tab.active { background:#1a73e8; color:#fff; border-color:#1a73e8; }
  #status { font-size:12.5px; color:#666; margin:8px 0; min-height:18px; }
  #name { font-size:14px; font-weight:600; margin:6px 0; }
  /* 画布像素 1:1 卡死，禁止任何缩放（含 CSS 缩放） */
  #screen { background:#fff; border:1px solid #eee; display:block; }
  .hint { color:#999; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<h1>u8g2-js · 中文字体家族对比</h1>
<div class="sub">用经典测试句「我能吞下玻璃而不伤身体」渲染每个字体家族的字号（句末附字体名）。<br>
<b>字体按需动态加载</b>：切到某个家族时才 import 它的字体模块，不一次性塞进页面。</div>
<div id="tabs"></div>
<div id="status">…</div>
<div id="name"></div>
<canvas id="screen"></canvas>
<div class="hint">← → 方向键或点击选项卡切换。本页为 ESM 动态加载，需本地服务器运行
（file:// 下浏览器禁止动态 import）；开发服务里打开 <code>demo/chinese-fonts/index.html</code> 即可。</div>
<script type="module" src="demo.js"></script>
</body>
</html>
